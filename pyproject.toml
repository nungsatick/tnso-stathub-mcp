[project]
name = "tnso-stathub-mcp"
version = "0.1.0"
description = "MCP server for progressive SDMX data discovery against the Thai National Statistical Office (TNSO) StatHub gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.26.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
